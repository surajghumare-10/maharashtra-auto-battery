services:
  - type: web
    name: maharashtra-auto-battery
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
